services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.prod
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /etc/scorpius-certs/fullchain.pem:/etc/nginx/certs/cert.pem:ro
      - /etc/scorpius-certs/privkey.pem:/etc/nginx/certs/key.pem:ro
      - /var/www/certbot:/var/www/certbot:ro
    depends_on: [calls]
    restart: unless-stopped
  calls:
    build:
      context: .
      dockerfile: Dockerfile.server
    env_file:
      - path: .env
        required: false
    restart: unless-stopped
